# CI for THE IMPOSSIBLE COMPILER WORKS (both wings). GitHub Actions are DISABLED on this repository until the
# owner approves; this file is kept ready. Every action is pinned to a full commit SHA. Linux runners only.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24', cache: npm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21' }
      - run: scripts/setup
      - run: scripts/test --tlc   # typecheck, lint, both wings' unit suites, bridge, receipts, live TLC corpus
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test  # both wings' browser journeys on 5726/5727
